# Netlify build settings.
# The site is a single static page, so there is no build step:
# Netlify publishes the repository root as-is on every push to main.
[build]
  publish = "."
  command = ""

# Keep the page out of search engines (it collects children's details).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
